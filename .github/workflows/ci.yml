name: Bayora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff

      - name: Lint control-plane
        run: ruff check control-plane/app/

      - name: Lint gateway
        run: ruff check gateway/app/

      - name: Lint sandboxes
        run: |
          ruff check sandboxes/red/app/
          ruff check sandboxes/blue/app/
          ruff check sandboxes/client-llm/app/

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build all containers
        run: docker compose build

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30
          docker compose ps

      - name: Check service health
        run: |
          curl -f http://localhost:8000/health || exit 1
          echo "Control plane is healthy"

      - name: Run integration tests
        run: |
          pip install requests
          python tests/test_integration.py

      - name: Security check
        run: bash scripts/check-security.sh

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v
